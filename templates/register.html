<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Hospital App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
      {% for message in messages %}
        alert("{{ message|replace('"','\\"') }}");
      {% endfor %}
    </script>
  {% endif %}
{% endwith %}


<div class="title">
    <h1>Enlightenment Hospital</h1>
</div>
<div class="box">
  <main class="login-card" role="main" aria-labelledby="login-title">
    <label style=" font-size:30px;">Register</label>
    <div style="height: 20px;"></div>


    <form method="POST">
      <div>
        <label>Username</label>
        <input name="uname" type="text" placeholder="Enter your username">
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password">
      </div>

      <div class="row"></div>

      <button type="submit">Sign in</button>

      <p class="muted">Already have an account? <a href="/">Login</a></p>
    </form>
  </main>
  </div>
</body>
</html>
